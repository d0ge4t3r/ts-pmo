<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>i love you more ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ==========================
         Envelope Screen
    =========================== -->

    <div id="envelope-container">

        <img src="Envelope.png"
             id="envelope"
             alt="Envelope">

        <p>ꨄ Letter for you ꨄ</p>

    </div>

   <!-- ==========================
     Letter Screen
========================== -->

<div id="letter-container">

    <div class="letter-window">

       <h1 id="letter-title">
    Do I love you more?
</h1>

<img src="Cats.png"
     id="letter-cats"
     class="cat"
     alt="Cute Cats">

<div class="buttons" id="letter-buttons">

    <img src="Yes.png"
         class="btn yes-btn"
         alt="Yes">

    <div class="no-wrapper">
        <img src="No.png"
             class="btn no-btn"
             alt="No">
    </div>

</div>

        <!-- Final Message -->
        <p id="final-text" class="final-text">

            <strong>Monthiversary Date ❤️</strong>

            <br><br>

            📍 Meow Restaurant

            <br>

            🕖 7:00 PM

            <br><br>

            Dress Fancy ✨

        </p>

    </div> <!-- letter-window -->

</div> <!-- letter-container -->

    <script src="script.js"></script>

</body>
</html>
